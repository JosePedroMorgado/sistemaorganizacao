<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Checklist</title>
    <link rel="stylesheet" href="checklist.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
</head>
<body>
    <div class="container">
        <aside id="side-menu" class="side-menu">
            <button id="close-menu-btn" class="close-menu-btn">X</button>
            <h3>Navegação</h3>
            <nav>
            <ul>
                <li><a href="checklist.html" class="active">✅ Checklist</a></li>
                <li><a href="agenda.html">📅 Agenda</a></li>
                <li><a href="relatorio.html">👥 Reuniões</a></li>
                <li><a href="reporte.html">📊 Report</a></li>
                <li><a href="wiki.html">📚 Wiki</a></li>
                <li><a href="dashboard.html">📈 Dashboard</a></li>
            </ul>
            </nav>
        </aside>


        <!-- Conteúdo Principal da Agenda -->
        <div class="main-content">
            <header>
                <h1>Minha Agenda de Atividades</h1>
            </header>
        
        <main class="main-content">

            <button id="menu-toggle-btn" class="menu-toggle-btn">☰</button>


        <!-- <section class="backup-section">
            <button id="export-btn" class="backup-btn export-btn" onclick="exportData()">
                📥 Exportar Dados (Backup)
            </button>
            <button id="import-btn" class="backup-btn import-btn" onclick="importData()">
                📤 Importar Dados (Restaurar)
            </button>
        </section> -->

            <main>
                <section class="add-task-section">
                    <h2>Adicionar Nova Tarefa</h2>
                    <form id="task-form">
                        <input type="hidden" id="task-id"> <!-- Campo oculto para edição -->
                        <div class="form-group">
                            <label for="task-text">Tarefa:</label>
                            <input type="text" id="task-text" placeholder="Ex: Comprar pão" required>
                        </div>
                        <div class="form-actions">
                            <button type="submit" id="submit-btn">Adicionar Tarefa</button>
                            <button type="button" id="cancel-edit-btn" class="hidden">Cancelar Edição</button>
                        </div>
                    </form>
                </section>

            <section class="task-list-section">
                <h2>Lista de Tarefas</h2>
                <div class="filters">
                    <button id="filter-pending" class="filter-btn active">Pendentes</button>
                    <button id="filter-completed" class="filter-btn">Concluídas</button>
                    <button id="filter-negative" class="filter-btn">Não Realizadas</button>
                    <button id="clear-finished-btn" class="btn-danger"><i class="fas fa-trash"></i> Limpar Finalizadas</button>
                </div>

                <!-- AQUI MUDOU: de <ul> para <div class="task-cards-container"> -->
                <div id="task-list" class="task-cards-container">
                    <!-- Tarefas serão renderizadas aqui como cards -->
                </div>
                <p id="empty-list-message" class="empty-message hidden">Nenhuma tarefa adicionada ainda. Que tal adicionar uma?</p>
            </section>

            <footer>
                <p>© 2026 Meu Checklist. Desenvolvido por JOSE.</p>
            </footer>
        </main>
    </div>
    <script src="backup.js"></script>
    <script src="checklist.js"></script>
</body>
</html>
